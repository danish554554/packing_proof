name: packproof_app
description: "PackProof app for recording and uploading packing proof videos to Google Drive."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.0.5
  share_plus: ^7.2.1
  mobile_scanner: ^3.5.6
  camera: ^0.10.5+5
  path_provider: ^2.1.2
  http: ^1.2.2
  http_parser: ^4.0.2
  google_sign_in: ^6.2.1
  shared_preferences: ^2.5.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

